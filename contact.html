<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | Axiom Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div data-header></div>
    <main>
      <header class="page-hero">
        <div class="wrap">
          <span class="kicker">Get in touch</span>
          <h1>Say hello.</h1>
          <p>
            Questions about Sunday, serving, or anything else? A real person will get back to you.
          </p>
        </div>
      </header>
      <section class="section white">
        <div class="wrap">
          <div class="section-head">
            <span class="kicker">Contact</span>
            <div>
              <h2>We'd love to hear your story.</h2>
              <p>
                <a href="mailto:josiah.weece@axiomchurch.com">josiah.weece@axiomchurch.com</a
                ><br /><a href="tel:5122655718">512-265-5718</a>
              </p>
            </div>
          </div>
          <form class="form">
            <label>First name<input required name="first" /></label
            ><label>Last name<input required name="last" /></label
            ><label>Email<input required type="email" name="email" /></label
            ><label>Phone<input type="tel" name="phone" /></label
            ><label class="wide"
              >How did you hear about us?<select name="heard">
                <option>Choose one</option>
                <option>Friend</option>
                <option>Instagram</option>
                <option>Facebook</option>
                <option>Google</option>
                <option>Other</option>
              </select></label
            ><label class="wide">Message<textarea name="message"></textarea></label>
            <div class="wide">
              <button class="pill fill" type="submit">Send message</button>
              <p data-status></p>
            </div>
          </form>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="js/main.js"></script>
  </body>
</html>
