<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <meta property="og:site_name" content="Axiom Church" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact | Axiom Church" />
    <meta property="og:description" content="Questions about Sunday, serving, or anything else? Send Axiom Church a message." />
    <meta property="og:image" content="https://axiomchurch-lac.vercel.app/assets/images/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Questions about Sunday, serving, or anything else? Send Axiom Church a message." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo is loaded with its width axis here: the tall condensed headings on this page use it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div data-header></div>
        <main class="praypage contactpage">
<section class="phero chero"><div class="p-wrap phero-in">
  <p class="p-kicker">Contact</p>
  <h1 class="tee">Say <em>hello.</em></h1>
  <p class="plede">Questions about Sunday, serving, or anything else? A real person will write you back.</p>
</div></section>

<section class="pask"><div class="p-wrap pask-in">
  <div>
    <h2 class="psec">Send a message.</h2>
    <p class="pnote">It goes straight to Josiah&rsquo;s inbox. Or reach him directly:</p>
    <p class="cdirect"><a class="textlink" href="mailto:josiah.weece@axiomchurch.com">josiah.weece@axiomchurch.com</a><br><a class="textlink" href="tel:5122655718">512-265-5718</a></p>
  </div>
  <form id="contactForm" class="pform" novalidate>
    <label for="cName">Name</label>
    <input id="cName" name="name" type="text" maxlength="80" autocomplete="name" required>
    <label for="cEmail">Email</label>
    <input id="cEmail" name="email" type="email" maxlength="120" autocomplete="email" required>
    <label for="cPhone">Phone <span>(optional)</span></label>
    <input id="cPhone" name="phone" type="tel" maxlength="30" autocomplete="tel">
    <label for="cMsg">Message</label>
    <textarea id="cMsg" name="message" maxlength="4000" rows="6" required></textarea>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><label for="cWeb">Website</label><input id="cWeb" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <button class="pbtn" type="submit">Send message</button>
    <p class="pstatus" id="cStatus" role="status"></p>
  </form>
</div></section>
    </main>
    <div data-footer></div>
    <script src="js/main.js"></script>
    <script>
      // Contact form: sends to /api/contact, which emails Josiah.
      (function () {
        var form = document.getElementById('contactForm'), st = document.getElementById('cStatus');
        function v(id) { return document.getElementById(id).value.trim(); }
        function err(msg, id) { st.className = 'pstatus err'; st.textContent = msg; if (id) document.getElementById(id).focus(); }
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!v('cName')) return err('Add your name.', 'cName');
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('cEmail'))) return err('Add an email we can write back to.', 'cEmail');
          if (v('cMsg').length < 2) return err('Write a message first.', 'cMsg');
          var btn = form.querySelector('button[type=submit]'); btn.disabled = true; st.className = 'pstatus'; st.textContent = 'Sending...';
          fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
            name: v('cName'), email: v('cEmail'), phone: v('cPhone'), message: v('cMsg'), website: document.getElementById('cWeb').value }) })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (x) { if (!x.ok) throw new Error(x.j.error || ''); form.reset(); st.textContent = 'Sent. You\'ll hear back soon.'; })
            .catch(function (e2) { err(e2.message || "That didn't send. Email josiah.weece@axiomchurch.com instead."); })
            .then(function () { btn.disabled = false; });
        });
      })();
    </script>
  </body>
</html>
