<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Events | Axiom Church</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div data-header></div>
    <main>
      <header class="page-hero">
        <div class="wrap">
          <span class="kicker">What's happening</span>
          <h1>Find your people.</h1>
          <p>Sunday is the start. Stay connected throughout the week.</p>
        </div>
      </header>
      <section class="section">
        <div class="wrap">
          <div class="grid three">
            <article class="poster">
              <small>Every week</small>
              <h3>Sunday Gathering<br />10 AM</h3>
              <span class="arrow">→</span>
            </article>
            <article class="poster">
              <small>Next step</small>
              <h3>Join a Team</h3>
              <span class="arrow">→</span>
            </article>
            <article class="poster">
              <small>Stay current</small>
              <h3>Follow Axiom on Instagram</h3>
              <span class="arrow">→</span>
            </article>
          </div>
        </div>
      </section>
      <section class="section orange">
        <div class="wrap">
          <p class="statement">Don't miss what's <em>next.</em></p>
          <div class="actions">
            <a class="pill" href="https://www.instagram.com/axiomchurchaustin/"
              >Follow @axiomchurchaustin</a
            >
          </div>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="js/main.js"></script>
  </body>
</html>
